[package]
name = "vrcx-0-nanashi-collector"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "RemoteSync collector child: a read-only, temporary-storage VRChat recorder"

[[bin]]
name = "vrcx-0-nanashi-collector"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
ciborium = "0.2.2"
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
] }
zeroize = { workspace = true, features = ["derive"] }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-composition = { path = "../composition", features = ["collector"] }
vrcx-0-core = { path = "../core" }
vrcx-0-persistence = { path = "../persistence", features = ["collector"] }
vrcx-0-platform = { path = "../platform" }

[dev-dependencies]
serde_json = { workspace = true }
vrcx-0-persistence = { path = "../persistence", features = ["collector", "test-utils"] }
