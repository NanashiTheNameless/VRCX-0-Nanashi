[package]
name = "vrcx-0-http-client"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Shared outbound HTTP protocol policy"

[dependencies]
http = "1"
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
reqwest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
url = { workspace = true }
vrcx-0-core = { path = "../core" }

[dev-dependencies]
bytes = { workspace = true }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
