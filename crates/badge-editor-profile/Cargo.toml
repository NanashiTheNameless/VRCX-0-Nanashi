[package]
name = "vrcx-0-badge-editor-profile"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Developer tool for the global badge editor: looks up one VRChat profile with the local app's saved session, read-only"
publish = false

[[bin]]
name = "badge-editor-profile"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
vrcx-0-core = { path = "../core" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-platform = { path = "../platform" }
vrcx-0-vrchat-client = { path = "../vrchat-client" }
