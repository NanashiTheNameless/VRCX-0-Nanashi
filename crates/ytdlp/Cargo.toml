[package]
name = "vrcx-0-ytdlp"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
vrcx-0-http-client = { path = "../http-client" }
base64.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
specta.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "sync", "macros"] }
vrcx-0-core = { path = "../core" }
zip = { workspace = true, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
