[package]
name = "vrcx-0-headless"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Headless data runtime"

[[bin]]
name = "vrcx-0-headless"
path = "src/main.rs"

[dependencies]
vrcx-0-core = { path = "../core" }
rpassword = "7.5.4"
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-platform = { path = "../platform" }
vrcx-0-composition = { path = "../composition" }
