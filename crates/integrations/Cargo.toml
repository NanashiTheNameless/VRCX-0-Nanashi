[package]
name = "vrcx-0-integrations"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "External service clients"

[dependencies]
vrcx-0-http-client = { path = "../http-client" }
futures-util = "0.3"
reqwest = { workspace = true, features = ["json", "socks", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
vrcx-0-core = { path = "../core" }
vrcx-0-contracts = { path = "../contracts" }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
