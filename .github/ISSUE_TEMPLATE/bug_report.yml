name: Bug Report
description: Something isn't working right
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting! Please make sure you're on the **latest version** first - the bug may already be fixed.

              This is a personal fork of VRCX-0. Please do not report fork bugs to upstream. Support is offered in English only.

    - type: input
      attributes:
          label: VRCX-0-Nanashi version
          description: You can find this in Settings → About (e.g., 2.9.1)
    - type: input
      attributes:
          label: Operating system
          description: e.g., Windows 11, macOS 26, Ubuntu 26.04
    - type: textarea
      attributes:
          label: What happened?
          description: Describe the bug - what were you doing, and what went wrong?
      validations:
          required: true
    - type: textarea
      attributes:
          label: What did you expect to happen?
    - type: textarea
      attributes:
          label: Screenshots / error log
          description: |
              Screenshots help a lot! If you see an error, the log file is at:
              - **Windows:** `%APPDATA%\VRCX-0-Nanashi\error-log.txt`
              - **macOS:** `~/Library/Application Support/VRCX-0-Nanashi/error-log.txt`
              - **Linux:** `~/.local/share/VRCX-0-Nanashi/error-log.txt`
    - type: input
      attributes:
          label: VRChat user ID (optional, for a badge)
          description: |
              If this leads to a change, you can get the **Bug Hunter** badge, which every user of the fork sees next to your name. Paste your VRChat user ID (starts with `usr_`; it is in your profile link on vrchat.com). Leave it empty if you do not want a badge. The badge list is public, so filling this in means you agree to your ID being listed in it.
          placeholder: usr_00000000-0000-0000-0000-000000000000
