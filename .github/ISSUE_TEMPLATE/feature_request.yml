name: Feature Request
description: Suggest an idea
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Got an idea? We'd love to hear it! This is a personal fork; general ideas may fit upstream (Map1en/VRCX-0) better. Please write in English; other languages are not supported.

    - type: textarea
      attributes:
          label: What would you like to see?
          description: Describe the feature - what should it do?
      validations:
          required: true
    - type: textarea
      attributes:
          label: Why is this useful?
          description: What problem does it solve, or what does it make easier?
    - type: textarea
      attributes:
          label: Anything else?
          description: Screenshots, examples, links - anything that helps explain your idea.
