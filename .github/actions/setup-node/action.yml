name: Setup Node
description: Set up the repository Node.js toolchain and install locked dependencies.

runs:
    using: composite
    steps:
        - uses: actions/setup-node@v7
          with:
              node-version: 26.x
              cache: npm
        - run: npm ci
          shell: bash
          env:
              npm_config_fetch_retries: '5'
              npm_config_fetch_retry_mintimeout: '20000'
              npm_config_fetch_retry_maxtimeout: '120000'
