name: Setup Linux Tauri
description: Install maintained Linux dependencies for CI checks or package builds.

inputs:
    mode:
        description: Dependency set to install (ci or package).
        required: true

runs:
    using: composite
    steps:
        - env:
              SETUP_MODE: ${{ inputs.mode }}
          run: |
              set -euo pipefail

              sudo apt-get update
              if [[ "$SETUP_MODE" == "ci" ]]; then
                  sudo apt-get install -y --no-install-recommends \
                      clang \
                      cmake \
                      g++ \
                      libclang-dev \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libayatana-appindicator3-dev \
                      libasound2-dev \
                      libfontconfig1-dev \
                      libfreetype6-dev \
                      librsvg2-dev \
                      mold
                  exit 0
              fi

              if [[ "$SETUP_MODE" != "package" ]]; then
                  echo "Unknown Linux Tauri setup mode: $SETUP_MODE" >&2
                  exit 1
              fi

              sudo apt-get install -y --no-install-recommends \
                  build-essential \
                  clang \
                  cmake \
                  curl \
                  file \
                  g++ \
                  libayatana-appindicator3-dev \
                  libasound2-dev \
                  libclang-dev \
                  libssl-dev \
                  libxdo-dev \
                  librsvg2-dev \
                  mold \
                  patchelf \
                  rpm \
                  wget
              sudo apt-get install -y --no-install-recommends \
                  libgtk-3-dev \
                  libwebkit2gtk-4.1-0 \
                  libwebkit2gtk-4.1-dev \
                  libjavascriptcoregtk-4.1-0 \
                  libjavascriptcoregtk-4.1-dev \
                  gir1.2-javascriptcoregtk-4.1 \
                  gir1.2-webkit2-4.1
          shell: bash
