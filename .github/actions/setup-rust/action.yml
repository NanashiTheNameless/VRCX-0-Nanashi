name: Setup Rust
description: Set up the stable Rust toolchain and an optional extra target.

inputs:
    target:
        description: Additional Rust compilation target to install.
        required: false
        default: ''
    cache-key:
        description: Compiled dependency cache to restore (empty disables caching).
        required: false
        default: ''
    save-cache:
        description: Allow this job to save the cache on master.
        required: false
        default: 'true'

runs:
    using: composite
    steps:
        - uses: dtolnay/rust-toolchain@stable
        - if: inputs.target != ''
          env:
              RUST_TARGET: ${{ inputs.target }}
          run: rustup target add "$RUST_TARGET"
          shell: bash
        - uses: Swatinem/rust-cache@v2
          if: inputs.cache-key != ''
          with:
              workspaces: . -> target
              shared-key: ci-${{ inputs.cache-key }}
              save-if: ${{ inputs.save-cache == 'true' && github.ref == 'refs/heads/master' }}
