name: Logger Image

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to publish the logger image from, for example v2.32.0-beta.1
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    image:
        name: Publish Logger Image
        runs-on: ubuntu-24.04
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.TAG }}

            - id: meta
              name: Resolve image tags
              run: |
                  version="${TAG#v}"
                  image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vrcx-0-logger"
                  if [[ "$version" == *-beta.* ]]; then
                      channel=beta
                  else
                      channel=latest
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "tags=$image:$version,$image:$channel" >> "$GITHUB_OUTPUT"

            - name: Download logger binaries
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.meta.outputs.version }}
              run: |
                  gh release download "$TAG" --pattern "vrcx-0-logger_${VERSION}_*" --dir logger-assets
                  mkdir -p crates/logger/dist
                  cp "logger-assets/vrcx-0-logger_${VERSION}_linux_x86_64" crates/logger/dist/vrcx-0-logger-amd64
                  cp "logger-assets/vrcx-0-logger_${VERSION}_linux_aarch64" crates/logger/dist/vrcx-0-logger-arm64
                  cp "logger-assets/vrcx-0-logger_${VERSION}_THIRD_PARTY_NOTICES.txt" crates/logger/dist/THIRD_PARTY_NOTICES.txt
                  cp LICENSE crates/logger/dist/LICENSE

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - uses: docker/build-push-action@v6
              with:
                  context: crates/logger
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ steps.meta.outputs.version }}
