name: Nightly

# Builds every push to master (no scheduled builds) and publishes it as a
# prerelease on the nightly update channel, so installed nightly builds update
# themselves through the in-app updater.
#
# Version scheme: <version>-Nightly-<GitSHA7>, where <version> comes from
# src-tauri/tauri.conf.json. Nightlies sharing a base version are ordered by
# publish date by the in-app updater.
#
# Also force-moves the `Nightly-Rolling` tag/release to the newest build.
#
# Required repository configuration:
#   vars.TAURI_UPDATER_PUBLIC_KEY           minisign public key
#   secrets.TAURI_UPDATER_PRIVATE_KEY       minisign private key
#   secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD

on:
    push:
        branches:
            - master
        paths-ignore:
            - '**/*.md'
            - '.github/ISSUE_TEMPLATE/**'
            - 'images/**'
    workflow_dispatch:

concurrency:
    group: nightly
    # Finish the active run (including publication); keep only the newest pending run.
    cancel-in-progress: false
    queue: single

permissions:
    contents: read

jobs:
    prepare:
        name: Prepare Nightly Metadata
        runs-on: ubuntu-24.04
        outputs:
            base_version: ${{ steps.version.outputs.base_version }}
            build_version: ${{ steps.version.outputs.build_version }}
            nightly_sha: ${{ steps.version.outputs.nightly_sha }}
            display_version: ${{ steps.version.outputs.display_version }}
            tag: ${{ steps.version.outputs.tag }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - id: version
              name: Compute nightly version
              run: |
                  base="$(node -p "require('./src-tauri/tauri.conf.json').version.split('-')[0]")"
                  sha7="$(git rev-parse --short=7 "$GITHUB_SHA")"
                  node scripts/prepare-release-version.ts \
                      --version "${base}-Nightly-${sha7}" \
                      --dry-run

    package:
        name: ${{ matrix.label }}
        needs: prepare
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: Windows Installer
                      os: windows-latest
                      webkit_build_target: ''
                      artifact_name: windows-installer
                      artifact_path: |
                          target/release/bundle/nsis/*_windows_x86_64_setup.exe
                          target/release/bundle/manifest_windows.json
                    - label: Linux Packages
                      os: ubuntu-24.04
                      webkit_build_target: safari17.4
                      artifact_name: linux-packages
                      artifact_path: |
                          target/release/bundle/appimage/*.AppImage
                          target/release/bundle/appimage/*.AppImage.sig
                          target/release/bundle/deb/*.deb
                          target/release/bundle/deb/*.deb.sig
                          target/release/bundle/rpm/*.rpm
                          target/release/bundle/rpm/*.rpm.sig
                          target/release/bundle/manifest_linux.json
        steps:
            # Defender scans every file the cache restore, build and cache save
            # touch; on hosted Windows runners that made saving the Rust cache
            # alone take ~3 minutes. The runner is discarded after the job.
            - name: Exclude build folders from Defender
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  try {
                      Add-MpPreference -ExclusionPath @(
                          "${{ github.workspace }}",
                          "$env:USERPROFILE\.cargo",
                          "$env:USERPROFILE\.rustup",
                          "$env:RUNNER_TEMP"
                      )
                  } catch {
                      Write-Host "Defender exclusion skipped: $_"
                  }

            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            # Restore compiled dependencies before the version stamp edits
            # Cargo.lock, so the cache key stays stable between builds.
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target
                  shared-key: nightly-${{ matrix.artifact_name }}

            - uses: ./.github/actions/setup-node

            - name: Install Linux package dependencies
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-linux-tauri
              with:
                  mode: package

            - name: Stamp nightly version
              run: node scripts/prepare-release-version.ts --version "${{ needs.prepare.outputs.build_version }}"

            - name: Inject updater public key
              env:
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
              run: |
                  if [[ -z "$TAURI_UPDATER_PUBLIC_KEY" ]]; then
                      echo "TAURI_UPDATER_PUBLIC_KEY repository variable is required for updater artifacts" >&2
                      exit 1
                  fi
                  node -e "const fs = require('node:fs'); const path = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.plugins ??= {}; config.plugins.updater ??= {}; config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; config.bundle ??= {}; config.bundle.windows ??= {}; delete config.bundle.windows.certificateThumbprint; delete config.bundle.windows.signCommand; fs.writeFileSync(path, JSON.stringify(config, null, 4) + '\n');"

            - name: Build package
              env:
                  # Set the CARGO_FINGERPRINT_LOG=1 repository variable for one run to
                  # log why each crate is rebuilt (to diagnose cache misses).
                  CARGO_LOG: ${{ vars.CARGO_FINGERPRINT_LOG == '1' && 'cargo::core::compiler::fingerprint=info' || '' }}
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
                  VRCX_0_WEBKIT_BUILD_TARGET: ${{ matrix.webkit_build_target }}
              run: |
                  override_config="${RUNNER_TEMP}/tauri-nightly-override.json"
                  case "$RUNNER_OS" in
                      Linux)
                          # rpm cannot carry a semver prerelease in Version; use Release instead.
                          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ version: process.argv[2], bundle: { linux: { rpm: { release: '0.nightly.' + process.argv[3] } } } }))" "$override_config" "${{ needs.prepare.outputs.base_version }}" "${{ needs.prepare.outputs.nightly_sha }}"
                          # mold links the release binary much faster than the default linker.
                          mold -run npm run tauri:build -- --config src-tauri/tauri.linux.conf.json --no-bundle -- --timings
                          npm run tauri -- bundle --config src-tauri/tauri.linux.conf.json --bundles appimage deb
                          npm run tauri -- bundle --config "$override_config" --bundles rpm
                          ;;
                      Windows)
                          npm run tauri:build -- --bundles nsis -- --timings
                          ;;
                  esac

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: cargo-timings-${{ matrix.artifact_name }}
                  path: target/cargo-timings/cargo-timing.html
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Prepare Windows release and updater assets
              if: runner.os == 'Windows'
              run: |
                  bundle_dir="target/release/bundle"
                  setup_source="$(find "$bundle_dir/nsis" -maxdepth 1 -name '*-setup.exe' | sort | head -n 1)"
                  if [[ -z "$setup_source" || ! -s "${setup_source}.sig" ]]; then
                      echo "Missing NSIS installer or updater signature in $bundle_dir/nsis" >&2
                      exit 1
                  fi
                  setup_path="$bundle_dir/nsis/VRCX-0-Nanashi_${{ needs.prepare.outputs.build_version }}_windows_x86_64_setup.exe"
                  mv "$setup_source" "$setup_path"
                  mv "${setup_source}.sig" "${setup_path}.sig"
                  node scripts/create-tauri-updater-manifest.ts \
                      --version "${{ needs.prepare.outputs.build_version }}" \
                      --tag "${{ needs.prepare.outputs.tag }}" \
                      --target "windows-x86_64-stable" \
                      --asset-name "$(basename "$setup_path")" \
                      --signature-file "${setup_path}.sig" \
                      --out "$bundle_dir/manifest_windows.json"

            - name: Prepare Linux release and updater assets
              if: runner.os == 'Linux'
              run: |
                  bundle_dir="target/release/bundle"
                  manifest_path="$bundle_dir/manifest_linux.json"
                  version="${{ needs.prepare.outputs.build_version }}"

                  rename_asset() {
                      local source="$1" destination="$2"
                      if [[ "$source" != "$destination" ]]; then
                          mv "$source" "$destination"
                      fi
                      if [[ -f "${source}.sig" && "${source}.sig" != "${destination}.sig" ]]; then
                          mv "${source}.sig" "${destination}.sig"
                      fi
                      if [[ ! -f "${destination}.sig" ]]; then
                          node node_modules/@tauri-apps/cli/tauri.js signer sign "$destination" > "${destination}.sig"
                      fi
                      if [[ ! -s "${destination}.sig" ]]; then
                          echo "No updater signature for $destination" >&2
                          exit 1
                      fi
                  }

                  appimage_path="$bundle_dir/appimage/VRCX-0-Nanashi_${version}_linux_x86_64.AppImage"
                  deb_path="$bundle_dir/deb/VRCX-0-Nanashi_${version}_linux_x86_64.deb"
                  rpm_path="$bundle_dir/rpm/VRCX-0-Nanashi_${version}_linux_x86_64.rpm"
                  rename_asset "$(find "$bundle_dir/appimage" -maxdepth 1 -name '*.AppImage' | sort | head -n 1)" "$appimage_path"
                  rename_asset "$(find "$bundle_dir/deb" -maxdepth 1 -name '*.deb' | sort | head -n 1)" "$deb_path"
                  rename_asset "$(find "$bundle_dir/rpm" -maxdepth 1 -name '*.rpm' | sort | head -n 1)" "$rpm_path"

                  base_arg=()
                  for pair in "appimage:$appimage_path" "deb:$deb_path" "rpm:$rpm_path"; do
                      kind="${pair%%:*}"
                      path="${pair#*:}"
                      node scripts/create-tauri-updater-manifest.ts \
                          --version "$version" \
                          --tag "${{ needs.prepare.outputs.tag }}" \
                          --target "linux-x86_64-${kind}-stable" \
                          --asset-name "$(basename "$path")" \
                          --signature-file "${path}.sig" \
                          "${base_arg[@]}" \
                          --out "$manifest_path"
                      base_arg=(--base "$manifest_path")
                  done

            - uses: actions/upload-artifact@v7
              with:
                  name: nightly-${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_path }}
                  if-no-files-found: error

    # Each macOS architecture compiles on its own runner in parallel; the
    # bundle job merges them into one universal app, DMG and updater archive.
    macos-binary:
        name: macOS Binary (${{ matrix.label }})
        needs: prepare
        runs-on: macos-latest
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: Apple Silicon
                      rust_target: aarch64-apple-darwin
                    - label: Intel
                      rust_target: x86_64-apple-darwin
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}

            # Restore compiled dependencies before the version stamp edits
            # Cargo.lock, so the cache key stays stable between builds.
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target
                  shared-key: nightly-macos-${{ matrix.rust_target }}

            - uses: ./.github/actions/setup-node

            - name: Stamp nightly version
              run: node scripts/prepare-release-version.ts --version "${{ needs.prepare.outputs.build_version }}"

            - name: Inject updater public key
              env:
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
              run: |
                  if [[ -z "$TAURI_UPDATER_PUBLIC_KEY" ]]; then
                      echo "TAURI_UPDATER_PUBLIC_KEY repository variable is required for updater artifacts" >&2
                      exit 1
                  fi
                  node -e "const fs = require('node:fs'); const path = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.plugins ??= {}; config.plugins.updater ??= {}; config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; fs.writeFileSync(path, JSON.stringify(config, null, 4) + '\n');"

            - name: Build binary
              env:
                  # Set the CARGO_FINGERPRINT_LOG=1 repository variable for one run to
                  # log why each crate is rebuilt (to diagnose cache misses).
                  CARGO_LOG: ${{ vars.CARGO_FINGERPRINT_LOG == '1' && 'cargo::core::compiler::fingerprint=info' || '' }}
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
                  VRCX_0_WEBKIT_BUILD_TARGET: safari18.2
              # --timings writes target/cargo-timings/cargo-timing.html: per-crate
              # compile time, to see what dominates the build.
              run: npm run tauri:build -- --target "${{ matrix.rust_target }}" --no-bundle -- --timings

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: cargo-timings-macos-${{ matrix.rust_target }}
                  path: target/cargo-timings/cargo-timing.html
                  if-no-files-found: ignore
                  retention-days: 14

            - uses: actions/upload-artifact@v7
              with:
                  name: macos-binary-${{ matrix.rust_target }}
                  path: |
                      target/${{ matrix.rust_target }}/release/vrcx-0
                      src-tauri/resources/licenses/THIRD_PARTY_NOTICES.txt
                  if-no-files-found: error
                  retention-days: 1

    macos-bundle:
        name: macOS DMG (Universal)
        needs:
            - prepare
            - macos-binary
        runs-on: macos-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: ./.github/actions/setup-node

            - name: Stamp nightly version
              run: node scripts/prepare-release-version.ts --version "${{ needs.prepare.outputs.build_version }}"

            - name: Inject updater public key
              env:
                  TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
              run: |
                  if [[ -z "$TAURI_UPDATER_PUBLIC_KEY" ]]; then
                      echo "TAURI_UPDATER_PUBLIC_KEY repository variable is required for updater artifacts" >&2
                      exit 1
                  fi
                  node -e "const fs = require('node:fs'); const path = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.plugins ??= {}; config.plugins.updater ??= {}; config.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; fs.writeFileSync(path, JSON.stringify(config, null, 4) + '\n');"

            - uses: actions/download-artifact@v8
              with:
                  pattern: macos-binary-*
                  merge-multiple: true

            - name: Merge universal binary
              run: |
                  universal_dir="target/universal-apple-darwin/release"
                  mkdir -p "$universal_dir"
                  lipo -create \
                      target/aarch64-apple-darwin/release/vrcx-0 \
                      target/x86_64-apple-darwin/release/vrcx-0 \
                      -output "$universal_dir/vrcx-0"
                  chmod +x "$universal_dir/vrcx-0"
                  lipo -info "$universal_dir/vrcx-0"

            - name: Bundle app and DMG
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
              run: |
                  override_config="${RUNNER_TEMP}/tauri-nightly-override.json"
                  node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ bundle: { macOS: { bundleVersion: process.argv[2] } } }))" "$override_config" "${{ github.run_number }}"
                  npm run tauri -- bundle --target universal-apple-darwin --bundles app,dmg --config "$override_config"

            - name: Prepare macOS release and updater assets
              run: |
                  dmg_dir="target/universal-apple-darwin/release/bundle/dmg"
                  dmg_path="$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' | sort | head -n 1)"
                  mv "$dmg_path" "$dmg_dir/VRCX-0-Nanashi_${{ needs.prepare.outputs.build_version }}_macos_universal.dmg"

                  updater_dir="target/universal-apple-darwin/release/bundle/macos"
                  archive_path="$(find "$updater_dir" -maxdepth 1 -name '*.app.tar.gz' | sort | head -n 1)"
                  if [[ -z "$archive_path" || ! -f "${archive_path}.sig" ]]; then
                      echo "Missing macOS updater archive or signature in $updater_dir" >&2
                      exit 1
                  fi
                  mv "$archive_path" "$updater_dir/VRCX-0-Nanashi_${{ needs.prepare.outputs.build_version }}_macos_universal.app.tar.gz"
                  mv "${archive_path}.sig" "$updater_dir/VRCX-0-Nanashi_${{ needs.prepare.outputs.build_version }}_macos_universal.app.tar.gz.sig"

            - uses: actions/upload-artifact@v7
              with:
                  name: nightly-macos-universal-dmg
                  path: |
                      target/universal-apple-darwin/release/bundle/dmg/*.dmg
                      target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
                      target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
                  if-no-files-found: error

    publish:
        name: Publish Nightly
        # Serialize publication independently of workflow locks.
        concurrency:
            group: release-publish
            cancel-in-progress: false
            queue: max
        needs:
            - prepare
            - package
            - macos-bundle
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            actions: write
        steps:
            - name: Prune superseded Rust caches
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Keep only the newest Rust cache per job. Every change to the
                  # dependency files saves a new ~5.5 GB set, and older sets push
                  # the repository past GitHub's 10 GB limit, causing evictions.
                  gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&sort=created_at&direction=desc" \
                      --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | "\(.id) \(.key)"' \
                  | awk '{ job = $2; sub(/-[0-9a-f]+$/, "", job); if (seen[job]++) print $1 }' \
                  | while read -r id; do
                      gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" || true
                  done

            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - uses: actions/download-artifact@v8
              with:
                  path: release-assets
                  pattern: nightly-*
                  merge-multiple: true

            - name: Flatten release assets
              run: |
                  find release-assets -mindepth 2 -type f -exec mv -n {} release-assets/ \;
                  find release-assets -mindepth 1 -type d -empty -delete
                  find release-assets -type f | sort

            - name: Build the updater manifest
              run: |
                  # One manifest holds every platform, so the app fetches a single
                  # asset instead of a per-platform pair.
                  manifest_path="release-assets/version_manifest.json"
                  for fragment in release-assets/manifest_windows.json release-assets/manifest_linux.json; do
                      if [[ ! -f "$fragment" ]]; then
                          echo "Missing updater manifest fragment: $fragment" >&2
                          exit 1
                      fi
                  done
                  node scripts/create-tauri-updater-manifest.ts \
                      --version "${{ needs.prepare.outputs.build_version }}" \
                      --tag "${{ needs.prepare.outputs.tag }}" \
                      --base release-assets/manifest_windows.json \
                      --base release-assets/manifest_linux.json \
                      --out "$manifest_path"

                  # One universal archive serves both Apple Silicon and Intel installs.
                  archive_name="VRCX-0-Nanashi_${{ needs.prepare.outputs.build_version }}_macos_universal.app.tar.gz"
                  for target in macos-aarch64-stable macos-x86_64-stable; do
                      node scripts/create-tauri-updater-manifest.ts \
                          --version "${{ needs.prepare.outputs.build_version }}" \
                          --tag "${{ needs.prepare.outputs.tag }}" \
                          --target "$target" \
                          --asset-name "$archive_name" \
                          --signature-file "release-assets/${archive_name}.sig" \
                          --base "$manifest_path" \
                          --out "$manifest_path"
                  done
                  rm -f release-assets/manifest_windows.json release-assets/manifest_linux.json

            - name: Remove updater signatures from GitHub release assets
              run: find release-assets -type f -name '*.sig' -delete

            - name: Create the nightly tag when it does not exist
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # A rerun of a failed publication, or a release whose tag was
                  # deleted, must not block on a missing tag.
                  tag="${{ needs.prepare.outputs.tag }}"
                  if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${tag}" >/dev/null 2>&1; then
                      gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                          -f ref="refs/tags/${tag}" \
                          -f sha="$GITHUB_SHA"
                  fi

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.prepare.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  name: Nightly ${{ needs.prepare.outputs.display_version }}
                  body: |
                      Automated nightly build of ${{ github.sha }}.
                  draft: false
                  prerelease: true
                  make_latest: false
                  files: release-assets/*
                  fail_on_unmatched_files: true

            - name: Update Nightly-Rolling release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # Rolling tag that always points at the newest nightly build and is
                  # the repository's "latest" release, so releases/latest/download/*
                  # always serves the newest build. Its tag name is not semver, so the
                  # in-app release catalog ignores it. GitHub only lets a full
                  # (non-prerelease) release be marked latest.
                  # The ref is created when missing and moved otherwise, so a fresh
                  # repository and a rerun both work without a local git push.
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/Nightly-Rolling" >/dev/null 2>&1; then
                      gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/Nightly-Rolling" \
                          -f sha="$GITHUB_SHA" -F force=true >/dev/null
                  else
                      gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                          -f ref="refs/tags/Nightly-Rolling" \
                          -f sha="$GITHUB_SHA" >/dev/null
                  fi
                  if gh release view Nightly-Rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      gh release upload Nightly-Rolling release-assets/* \
                          --repo "$GITHUB_REPOSITORY" --clobber
                  else
                      gh release create Nightly-Rolling release-assets/* \
                          --repo "$GITHUB_REPOSITORY" \
                          --verify-tag \
                          --latest \
                          --title "Nightly (rolling)" \
                          --notes "Latest nightly build: ${{ needs.prepare.outputs.display_version }} from $GITHUB_SHA."
                  fi

            - name: Prune old nightlies (keep 10)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
                      --jq '[.[] | select(.isPrerelease and (.tagName | test("-(Nightly-[0-9a-f]{7}|beta\\.[0-9]+)$")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
                  | while read -r tag; do
                      gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                  done
