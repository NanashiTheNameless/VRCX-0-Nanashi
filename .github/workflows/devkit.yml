name: Dev Kit

# Manual only: a full three-platform build is too costly to repeat per nightly.
on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    package:
        name: Package Dev Kit
        uses: ./.github/workflows/_package-variant.yml
        with:
            variant: devkit
