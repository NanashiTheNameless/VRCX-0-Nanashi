name: Dev Kit

# Manual only: a full three-platform build is too costly to repeat per nightly.
on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    package:
        name: Package Dev Kit
        uses: ./.github/workflows/_package-variant.yml
        secrets:
            NN_SIGNING_MACOS_P12_BASE64: ${{ secrets.NN_SIGNING_MACOS_P12_BASE64 }}
            NN_SIGNING_KEY_PEM_BASE64: ${{ secrets.NN_SIGNING_KEY_PEM_BASE64 }}
            NN_SIGNING_PASSWORD: ${{ secrets.NN_SIGNING_PASSWORD }}
        with:
            variant: devkit
