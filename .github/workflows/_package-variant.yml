name: Package Variant

on:
    workflow_call:
        inputs:
            variant:
                description: Package variant (preview or devkit).
                required: true
                type: string

# Concurrency belongs to the Preview / Dev Kit caller and covers these jobs too.
# A second lock using github.workflow here would collide with the caller's lock.
permissions:
    contents: read

jobs:
    prepare:
        name: Prepare Package Metadata
        runs-on: ubuntu-24.04
        outputs:
            build_script: ${{ steps.metadata.outputs.build_script }}
            display_name: ${{ steps.metadata.outputs.display_name }}
            timestamp: ${{ steps.timestamp.outputs.timestamp }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - uses: dtolnay/rust-toolchain@stable

            - id: metadata
              name: Resolve package variant
              env:
                  PACKAGE_VARIANT: ${{ inputs.variant }}
              run: |
                  case "$PACKAGE_VARIANT" in
                      preview)
                          echo "build_script=tauri:build:devtools" >> "$GITHUB_OUTPUT"
                          echo "display_name=Preview" >> "$GITHUB_OUTPUT"
                          ;;
                      devkit)
                          echo "build_script=tauri:build:devkit" >> "$GITHUB_OUTPUT"
                          echo "display_name=Dev Kit" >> "$GITHUB_OUTPUT"
                          ;;
                      *)
                          echo "Unknown package variant: $PACKAGE_VARIANT" >&2
                          exit 1
                          ;;
                  esac
            - id: timestamp
              name: Generate package timestamp
              run: |
                  node <<'NODE'
                  const fs = require('node:fs');

                  const timestampParts = new Intl.DateTimeFormat('en-US', {
                      timeZone: 'Asia/Tokyo',
                      year: 'numeric',
                      month: '2-digit',
                      day: '2-digit',
                      hour: '2-digit',
                      minute: '2-digit',
                      hourCycle: 'h23'
                  })
                      .formatToParts(new Date())
                      .reduce((parts, part) => {
                          parts[part.type] = part.value;
                          return parts;
                      }, {});
                  const timestamp = `${timestampParts.year}${timestampParts.month}${timestampParts.day}-${timestampParts.hour}${timestampParts.minute}`;

                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `timestamp=${timestamp}\n`);
                  NODE

    package:
        name: ${{ needs.prepare.outputs.display_name }} ${{ matrix.platform }}
        needs: prepare
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: windows_x86_64
                      os: windows-latest
                    - platform: linux_x86_64
                      os: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: dtolnay/rust-toolchain@stable

            # Restore compiled dependencies before the version stamp edits
            # Cargo.lock, so the cache key stays stable between builds.
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target
                  shared-key: ${{ inputs.variant }}-${{ matrix.platform }}

            - uses: ./.github/actions/setup-node

            - uses: ./.github/actions/setup-linux-tauri
              if: runner.os == 'Linux'
              with:
                  mode: package

            - id: version
              name: Read package version
              run: |
                  version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  if [[ -z "$version" ]]; then
                      echo "Missing package version." >&2
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Validate package version
              if: inputs.variant == 'devkit'
              run: |
                  node scripts/prepare-release-version.ts \
                      --version "${{ steps.version.outputs.version }}" \
                      --dry-run

            - id: config
              name: Prepare package config
              env:
                  MATRIX_PLATFORM: ${{ matrix.platform }}
                  PACKAGE_VARIANT: ${{ inputs.variant }}
              run: |
                  node <<'NODE'
                  const fs = require('node:fs');

                  const platform = process.env.MATRIX_PLATFORM;
                  const runnerOs = process.env.RUNNER_OS;
                  const variant = process.env.PACKAGE_VARIANT;
                  const tauriConfigPath = 'src-tauri/tauri.conf.json';
                  const linuxConfigPath = 'src-tauri/tauri.linux.conf.json';
                  const outputConfigPath = `src-tauri/tauri.${variant}.${platform}.conf.json`;

                  const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'));
                  let config = structuredClone(tauriConfig);

                  if (runnerOs === 'Linux') {
                      const linuxConfig = JSON.parse(fs.readFileSync(linuxConfigPath, 'utf8'));
                      config = {
                          bundle: {
                              ...(linuxConfig.bundle ?? {}),
                              targets: ['appimage'],
                              createUpdaterArtifacts: false
                          }
                      };
                  } else {
                      config.bundle ??= {};
                      config.bundle.createUpdaterArtifacts = false;
                      if (runnerOs === 'Windows') {
                          config.bundle.windows ??= {};
                          delete config.bundle.windows.certificateThumbprint;
                          delete config.bundle.windows.signCommand;
                      }
                  }

                  fs.writeFileSync(outputConfigPath, `${JSON.stringify(config, null, 4)}\n`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `config=${outputConfigPath}\n`);
                  NODE

            - name: Build Windows package
              if: runner.os == 'Windows'
              env:
                  BUILD_SCRIPT: ${{ needs.prepare.outputs.build_script }}
                  PACKAGE_VARIANT: ${{ inputs.variant }}
                  VRCX_0_BUILD_LABEL: ${{ inputs.variant }}
                  VRCX_0_BUILD_BADGE: ${{ needs.prepare.outputs.display_name }} ${{ needs.prepare.outputs.timestamp }}
              run: |
                  args=(
                      --config "${{ steps.config.outputs.config }}"
                      --no-sign
                      --no-bundle
                  )
                  if [[ "$PACKAGE_VARIANT" == "preview" ]]; then
                      args=(--debug "${args[@]}")
                  fi
                  npm run "$BUILD_SCRIPT" -- "${args[@]}"

            - name: Build Linux AppImage
              if: runner.os == 'Linux'
              env:
                  BUILD_SCRIPT: ${{ needs.prepare.outputs.build_script }}
                  VRCX_0_BUILD_LABEL: ${{ inputs.variant }}
                  VRCX_0_BUILD_BADGE: ${{ needs.prepare.outputs.display_name }} ${{ needs.prepare.outputs.timestamp }}
                  VRCX_0_WEBKIT_BUILD_TARGET: safari17.4
              run: |
                  mold -run npm run "$BUILD_SCRIPT" -- \
                      --config "${{ steps.config.outputs.config }}" \
                      --bundles appimage

            - id: collect
              name: Collect package artifact
              env:
                  PACKAGE_VARIANT: ${{ inputs.variant }}
              run: |
                  mkdir -p package-assets
                  version="${{ steps.version.outputs.version }}"
                  timestamp="${{ needs.prepare.outputs.timestamp }}"

                  if [[ "$PACKAGE_VARIANT" == "preview" ]]; then
                      stem="VRCX-0-Nanashi_${version}_preview_${timestamp}"
                      artifact_name="preview-${{ matrix.platform }}-${version}-${timestamp}"
                  else
                      stem="VRCX-0-Nanashi_${version}_devkit"
                      artifact_name="devkit-${{ matrix.platform }}-${version}"
                  fi

                  case "${{ matrix.platform }}" in
                      windows_x86_64)
                          if [[ "$PACKAGE_VARIANT" == "preview" ]]; then
                              source="target/debug/vrcx-0.exe"
                          else
                              source="target/release/vrcx-0.exe"
                          fi
                          cp "$source" "package-assets/${stem}_windows_x86_64.exe"
                          ;;
                      linux_x86_64)
                          cp target/release/bundle/appimage/*.AppImage "package-assets/${stem}_linux_x86_64.AppImage"
                          ;;
                      *)
                          echo "Unknown platform: ${{ matrix.platform }}" >&2
                          exit 1
                          ;;
                  esac

                  echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
                  ls -la package-assets

            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.collect.outputs.artifact_name }}
                  path: package-assets/*
                  if-no-files-found: error

    # Each macOS architecture compiles on its own runner in parallel; the
    # bundle job merges them into one universal app and DMG.
    macos-binary:
        name: ${{ needs.prepare.outputs.display_name }} macOS binary (${{ matrix.label }})
        needs: prepare
        runs-on: macos-latest
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: Apple Silicon
                      rust_target: aarch64-apple-darwin
                    - label: Intel
                      rust_target: x86_64-apple-darwin
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target
                  shared-key: ${{ inputs.variant }}-macos-${{ matrix.rust_target }}

            - uses: ./.github/actions/setup-node

            - name: Validate package version
              if: inputs.variant == 'devkit'
              run: |
                  node scripts/prepare-release-version.ts \
                      --version "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
                      --dry-run

            - name: Build binary
              env:
                  BUILD_SCRIPT: ${{ needs.prepare.outputs.build_script }}
                  VRCX_0_BUILD_LABEL: ${{ inputs.variant }}
                  VRCX_0_BUILD_BADGE: ${{ needs.prepare.outputs.display_name }} ${{ needs.prepare.outputs.timestamp }}
                  VRCX_0_WEBKIT_BUILD_TARGET: safari18.2
              run: |
                  override_config="${RUNNER_TEMP}/tauri-package-override.json"
                  echo '{"bundle":{"createUpdaterArtifacts":false,"targets":["dmg"]}}' > "$override_config"
                  npm run "$BUILD_SCRIPT" -- \
                      --target "${{ matrix.rust_target }}" \
                      --config "$override_config" \
                      --no-bundle

            - uses: actions/upload-artifact@v7
              with:
                  name: macos-binary-${{ inputs.variant }}-${{ matrix.rust_target }}
                  path: |
                      target/${{ matrix.rust_target }}/release/vrcx-0
                      src-tauri/resources/licenses/THIRD_PARTY_NOTICES.txt
                  if-no-files-found: error
                  retention-days: 1

    macos-bundle:
        name: ${{ needs.prepare.outputs.display_name }} macos_universal
        needs:
            - prepare
            - macos-binary
        runs-on: macos-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: ./.github/actions/setup-node

            - uses: actions/download-artifact@v8
              with:
                  pattern: macos-binary-${{ inputs.variant }}-*
                  merge-multiple: true

            - name: Merge universal binary
              run: |
                  universal_dir="target/universal-apple-darwin/release"
                  mkdir -p "$universal_dir"
                  lipo -create \
                      target/aarch64-apple-darwin/release/vrcx-0 \
                      target/x86_64-apple-darwin/release/vrcx-0 \
                      -output "$universal_dir/vrcx-0"
                  chmod +x "$universal_dir/vrcx-0"
                  lipo -info "$universal_dir/vrcx-0"

            - name: Bundle DMG
              run: |
                  override_config="${RUNNER_TEMP}/tauri-package-override.json"
                  echo '{"bundle":{"createUpdaterArtifacts":false,"targets":["dmg"]}}' > "$override_config"
                  npm run tauri -- bundle --target universal-apple-darwin --bundles dmg --config "$override_config"

            - id: collect
              name: Collect package artifact
              env:
                  PACKAGE_VARIANT: ${{ inputs.variant }}
              run: |
                  mkdir -p package-assets
                  version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
                  timestamp="${{ needs.prepare.outputs.timestamp }}"

                  if [[ "$PACKAGE_VARIANT" == "preview" ]]; then
                      stem="VRCX-0-Nanashi_${version}_preview_${timestamp}"
                      artifact_name="preview-macos_universal-${version}-${timestamp}"
                  else
                      stem="VRCX-0-Nanashi_${version}_devkit"
                      artifact_name="devkit-macos_universal-${version}"
                  fi

                  cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "package-assets/${stem}_macos_universal.dmg"
                  echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
                  ls -la package-assets

            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.collect.outputs.artifact_name }}
                  path: package-assets/*
                  if-no-files-found: error
