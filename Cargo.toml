[workspace]
members = [
    "src-tauri",
    "crates/i18n",
    "crates/core",
    "crates/http-client",
    "crates/persistence",
    "crates/integrations",
    "crates/vrchat-client",
    "crates/vr-overlay",
    "crates/platform",
    "crates/local-server",
    "crates/host-desktop",
    "crates/media",
    "crates/runtime-event",
    "crates/contracts",
    "crates/application-core",
    "crates/outbound-adapters",
    "crates/application-activity",
    "crates/application-realtime",
    "crates/application",
    "crates/application-game",
    "crates/composition",
    "crates/runtime-host-desktop",
    "crates/overlay-runtime",
    "crates/headless",
    "crates/mcp",
    "crates/integration-api",
    "crates/assistant",
    "crates/ytdlp",
    "crates/remote-sync",
    "crates/collector-cli"
]
default-members = [
    "src-tauri",
    "crates/i18n",
    "crates/core",
    "crates/http-client",
    "crates/persistence",
    "crates/integrations",
    "crates/vrchat-client",
    "crates/vr-overlay",
    "crates/platform",
    "crates/local-server",
    "crates/host-desktop",
    "crates/media",
    "crates/runtime-event",
    "crates/contracts",
    "crates/application-core",
    "crates/outbound-adapters",
    "crates/application-activity",
    "crates/application-realtime",
    "crates/application",
    "crates/application-game",
    "crates/composition",
    "crates/runtime-host-desktop",
    "crates/overlay-runtime",
    "crates/headless",
    "crates/mcp",
    "crates/integration-api",
    "crates/assistant",
    "crates/ytdlp",
    "crates/remote-sync"
]
resolver = "2"

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
vrcx-0-nanashi-website-protocol = { git = "https://github.com/NanashiTheNameless/VRCX-0-Nanashi-Website", rev = "7b04fed50fd3a91d077bf05e9527ea83122baabb" }
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
chacha20poly1305 = "0.11"
chrono = "0.4"
compact_str = { version = "0.10", features = ["serde"] }
dirs = "7"
image = "0.25"
iana-time-zone = "0.1"
machine-uid = "0.6"
percent-encoding = "2"
proptest = "1"
# The app installs ring (vrcx_0_core::tls); reqwest's HTTP/3 feature also builds AWS-LC.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "http3",
    "system-proxy",
] }
regex = "1"
fs4 = "1.1"
rusqlite = "0.40"
serde = "1"
serde_json = "1"
semver = "1"
sha2 = "0.11"
slint = { version = "~1.18", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "std"
] }
slint-build = "~1.18"
specta = { version = "=2.0.0-rc.22", features = [
    "derive",
    "serde_json",
    "chrono"
] }
sys-locale = "0.3"
tar = "0.4"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
walkdir = "2"
zip = { version = "8", default-features = false }
zstd = { version = "0.14", features = ["zstdmt"] }

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.test]
debug = false
opt-level = 0

[profile.release]
# No cross-crate LTO: nightly --timings showed thin LTO of the final binary
# was ~40-50% of every package build, running mostly single-threaded on
# 3-core runners. Without it, crates optimize in parallel as they build and
# the final step is just a link; the binary is somewhat larger. Crate-local
# thin LTO across codegen units still applies.
lto = false
opt-level = "s"
panic = "abort"
strip = true

# The binary stays size-optimized, but CPU-bound hot paths get full
# optimization: VR overlay software rendering and text shaping, VRChat API
# JSON, image decoding/resizing, and SQLite. Only these crates rebuild at -O3,
# so package build time grows little.
[profile.release.package.i-slint-core]
opt-level = 3

[profile.release.package.i-slint-renderer-software]
opt-level = 3

[profile.release.package.parley]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.skrifa]
opt-level = 3

[profile.release.package.read-fonts]
opt-level = 3

[profile.release.package.swash]
opt-level = 3

[profile.release.package.zeno]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.libwebp-sys]
opt-level = 3

[profile.release.package.fast_image_resize]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3
